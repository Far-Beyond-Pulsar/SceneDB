[package]
name = "pulsar_scenedb"
version = "0.1.0"
edition = "2021"
description = "SceneDB 2.0 — engine-wide spatial database (Layer 1 storage core)"

[features]
default = []
gpu = ["dep:wgpu"]
telemetry = ["dep:socket2", "dep:serde", "gpu"]

[dependencies]
# Repinned onto the `dyn-method-registry` branch (Pulsar-Reflection#3) for
# DynMethodRegistry/DYN_METHOD_REGISTRY, which `subsystem.rs`'s dynamic
# dispatch path needs. Additive-only on the Pulsar-Reflection side (see
# that PR), so this is safe ahead of merge; repin to whatever commit
# Pulsar-Reflection#3 merges as once that lands.
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "b9dd888d84fd5e0724f8c6cc8abcbb10c351e5ff" }
serde_json        = { workspace = true }
socket2           = { workspace = true, optional = true }
serde             = { workspace = true, optional = true }
ahash             = "0.8"
profiling         = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Profiling", rev = "12424a5f75166332f9f1d2741281f6fc4847b44d" }
tracing           = { workspace = true }
wgpu              = { version = "30", optional = true }
# Real (non-dev) dependency so `pub use pulsar_scenedb_derive::SceneStore`
# below can re-export it -- downstream crates that already depend on
# `pulsar_scenedb` (which is every real consumer) get `#[derive(SceneStore)]`
# for free instead of also needing a direct `pulsar_scenedb_derive`
# dependency of their own, the same facade pattern `serde`/`serde_derive`
# use. Was a dev-dependency only (this crate's own benches/examples/tests
# used it directly, pre-re-export); still exercised by those, so this is a
# promotion, not a new relationship.
pulsar_scenedb_derive = { path = "../pulsar_scenedb_derive" }

[dev-dependencies]
rand = "0.8"
criterion = { version = "=0.8.2" }
pollster = "1.0"
naga = { version = "30", features = ["wgsl-in"] }
ratatui = "0.29"
crossterm = "0.28"
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std"] }

